services:
  db:
    image: mysql:8.0
    container_name: yujing-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: yujing
      MYSQL_USER: yujing
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in app/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in app/.env}
    ports:
      - "3307:3306"
    volumes:
      - yujing-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    container_name: yujing-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/yujing?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: yujing
      DB_PASSWORD: ${MYSQL_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      YUJING_ADMIN_USERNAME: ${YUJING_ADMIN_USERNAME:?set YUJING_ADMIN_USERNAME in app/.env}
      YUJING_ADMIN_PASSWORD: ${YUJING_ADMIN_PASSWORD:?set YUJING_ADMIN_PASSWORD in app/.env}
      YUJING_CORS_ORIGINS: ${YUJING_CORS_ORIGINS:-http://localhost:5173}
      UPLOAD_DIR: /data/uploads
    ports:
      - "8080:8080"
    volumes:
      - yujing-uploads:/data/uploads
    restart: unless-stopped

volumes:
  yujing-db-data:
  yujing-uploads:
